name: Mobile CI

on:
  push:
    branches: [master, main, develop]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

jobs:
  ci:
    name: Type-check · Lint · Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: 'npm'
          cache-dependency-path: |
            mobile/package-lock.json
            packages/contracts/package-lock.json

      - name: Install contracts dependencies
        working-directory: .
        run: npm --prefix packages/contracts ci

      - name: Build contracts package
        working-directory: .
        run: npm --prefix packages/contracts run build

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --coverage --watchAll=false --forceExit

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: ./mobile/coverage
          flags: mobile
          fail_ci_if_error: false
        continue-on-error: true

  eas-build:
    name: EAS Android APK (production-apk)
    needs: ci
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: 'npm'
          cache-dependency-path: |
            mobile/package-lock.json
            packages/contracts/package-lock.json

      - name: Install contracts dependencies
        working-directory: .
        run: npm --prefix packages/contracts ci

      - name: Build contracts package
        working-directory: .
        run: npm --prefix packages/contracts run build

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Build — production-apk (no-wait)
        run: >
          eas build
          --platform android
          --profile production-apk
          --non-interactive
          --no-wait
          --account taxbridgeng
          --message "CI ${{ github.run_number }}: ${{ github.event.head_commit.message }}"
