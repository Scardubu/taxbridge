name: Production API Image

on:
  pull_request:
    branches: [master]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'backend/**'
      - 'packages/contracts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/production-image.yml'
  push:
    branches: [master]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'backend/**'
      - 'packages/contracts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/production-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Clean production Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the Render API image without cache
        run: |
          docker build --pull --no-cache --tag taxbridge-api:${GITHUB_SHA} .
