name: EAS Production Build (Zero-Cache)

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/eas-build-production.yml'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - all
      profile:
        description: 'EAS build profile'
        required: true
        default: 'production-apk'
        type: choice
        options:
          - production-apk
          - production
          - preview

jobs:
  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 🛒 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: 📦 Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🧹 Nuclear Cache Wipe
        working-directory: mobile
        run: |
          echo "🧹 Clearing all caches..."
          rm -rf node_modules
          rm -rf .metro
          rm -rf $TMPDIR/metro-* 2>/dev/null || true
          rm -rf android/build android/app/build android/.gradle
          rm -rf ios/build ios/Pods
          npm cache clean --force
          echo "✅ Cache wipe complete"

      - name: 📥 Install dependencies (clean)
        working-directory: mobile
        run: npm ci --prefer-offline=false --no-audit --loglevel=error

      - name: 🔧 AI SDK Self-Healer (fix-expo-sdk)
        working-directory: mobile
        run: node scripts/fix-expo-sdk.js

      - name: 🔍 Run Expo Doctor
        working-directory: mobile
        run: npx expo-doctor

      - name: 🏗️ Clean Prebuild
        working-directory: mobile
        run: npx expo prebuild --clean --no-install

      - name: 🚀 EAS Build (Cache-Free APK)
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: https://taxbridge-api-ker8.onrender.com
          EAS_NO_VCS: '0'
        run: |
          eas build \
            --platform ${{ github.event.inputs.platform || 'android' }} \
            --profile ${{ github.event.inputs.profile || 'production-apk' }} \
            --clear-cache \
            --no-wait \
            --non-interactive

      - name: 📊 Build Status
        if: success()
        run: |
          echo "✅ Build triggered successfully"
          echo "🔗 Check status: https://expo.dev/accounts/taxbridge/projects/taxbridge/builds"
