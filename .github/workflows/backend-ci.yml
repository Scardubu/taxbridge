name: Backend CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  NODE_VERSION: '20.19.4'
  DUPLO_CLIENT_ID: ${{ secrets.DUPLO_CLIENT_ID }}
  DUPLO_CLIENT_SECRET: ${{ secrets.DUPLO_CLIENT_SECRET }}
  DUPLO_API_URL: ${{ secrets.DUPLO_API_URL }}
  REMITA_API_KEY: ${{ secrets.REMITA_API_KEY }}
  REMITA_MERCHANT_ID: ${{ secrets.REMITA_MERCHANT_ID }}
  REMITA_SERVICE_TYPE_ID: ${{ secrets.REMITA_SERVICE_TYPE_ID }}

jobs:
  # Unit Tests (60% of test pyramid)
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: Build shared contracts
        run: npm run build --workspace=@taxbridge/contracts

      - name: Run unit tests with coverage
        run: npm run test:unit --prefix backend
        env:
          CI: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage/lcov.info
          flags: unit-tests
          name: codecov-umbrella

  # Integration Tests (25% of test pyramid)
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ${{ format('tbci-{0}-{1}', github.run_id, github.run_attempt) }}
          POSTGRES_DB: taxbridge_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci

      - name: Build shared contracts
        run: npm run build --workspace=@taxbridge/contracts

      - name: Generate Prisma client and apply the canonical migration chain
        run: |
          npm run prisma:generate --prefix backend
          npm run prisma:migrate:deploy --prefix backend
        env:
          DATABASE_URL: postgresql://postgres:${{ format('tbci-{0}-{1}', github.run_id, github.run_attempt) }}@localhost:5432/taxbridge_test
          DIRECT_URL: postgresql://postgres:${{ format('tbci-{0}-{1}', github.run_id, github.run_attempt) }}@localhost:5432/taxbridge_test

      - name: Run integration tests
        run: npm run test:integration --prefix backend
        env:
          CI: true
          DATABASE_URL: postgresql://postgres:${{ format('tbci-{0}-{1}', github.run_id, github.run_attempt) }}@localhost:5432/taxbridge_test
          REDIS_URL: redis://localhost:6379

      - name: Test Duplo integration
        run: npm exec --prefix backend -- jest src/integrations/duplo.integration.test.ts --verbose
        env:
          CI: true
          NODE_ENV: test

      - name: Test Remita integration
        run: npm exec --prefix backend -- jest src/integrations/remita.integration.test.ts --verbose
        env:
          CI: true
          NODE_ENV: test

  # E2E Tests (10% of test pyramid)
  # End-to-End Tests (run against the real Fastify API and disposable dependencies)
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ format('tbci-{0}-{1}', github.run_id, github.run_attempt) }}
          POSTGRES_DB: taxbridge_e2e
        options: >-
          --health-cmd "pg_isready -U postgres -d taxbridge_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379
    env:
      CI: 'true'
      NODE_ENV: development
      PORT: '3000'
      LOG_FORMAT: json
      LOG_LEVEL: error
      JWT_SECRET: ci-only-taxbridge-jwt-secret-not-valid-outside-this-workflow
      ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql://postgres:${{ format('tbci-{0}-{1}', github.run_id, github.run_attempt) }}@localhost:5432/taxbridge_e2e
      DIRECT_URL: postgresql://postgres:${{ format('tbci-{0}-{1}', github.run_id, github.run_attempt) }}@localhost:5432/taxbridge_e2e
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: Build shared contracts
        run: npm run build --workspace=@taxbridge/contracts

      - name: Generate Prisma client and apply migrations
        run: |
          npm run prisma:generate --prefix backend
          npm run prisma:migrate:deploy --prefix backend

      - name: Start Fastify API
        run: |
          npm run dev --prefix backend > "$RUNNER_TEMP/taxbridge-e2e-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/taxbridge-e2e-api.pid"
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost:3000/health/ready >/dev/null; then
              echo "Fastify API is ready."
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/taxbridge-e2e-api.log"
          echo "Fastify API failed to become ready." >&2
          exit 1

      - name: Run E2E test suite
        run: npm run test:e2e --prefix backend

      - name: Stop Fastify API
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/taxbridge-e2e-api.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/taxbridge-e2e-api.pid")" 2>/dev/null || true
          fi
          if [ -f "$RUNNER_TEMP/taxbridge-e2e-api.log" ]; then
            tail -n 100 "$RUNNER_TEMP/taxbridge-e2e-api.log"
          fi

  # Security Tests (5% of test pyramid)
  # Security Tests (API-backed; uses the same application and dependencies as runtime)
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ format('tbci-{0}-{1}', github.run_id, github.run_attempt) }}
          POSTGRES_DB: taxbridge_security
        options: >-
          --health-cmd "pg_isready -U postgres -d taxbridge_security"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379
    env:
      CI: 'true'
      NODE_ENV: development
      PORT: '3000'
      LOG_FORMAT: json
      LOG_LEVEL: error
      JWT_SECRET: ci-only-taxbridge-jwt-secret-not-valid-outside-this-workflow
      ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql://postgres:${{ format('tbci-{0}-{1}', github.run_id, github.run_attempt) }}@localhost:5432/taxbridge_security
      DIRECT_URL: postgresql://postgres:${{ format('tbci-{0}-{1}', github.run_id, github.run_attempt) }}@localhost:5432/taxbridge_security
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: Build shared contracts
        run: npm run build --workspace=@taxbridge/contracts

      - name: Generate Prisma client and apply migrations
        run: |
          npm run prisma:generate --prefix backend
          npm run prisma:migrate:deploy --prefix backend

      - name: Start the actual Fastify API
        run: |
          npm run dev --prefix backend > "$RUNNER_TEMP/taxbridge-security-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/taxbridge-security-api.pid"
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost:3000/health/ready >/dev/null; then
              echo "Fastify API is ready."
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/taxbridge-security-api.log"
          echo "Fastify API failed to become ready." >&2
          exit 1

      - name: Run route-aware security regression checks
        run: npm run test:security --prefix backend

      - name: Run OWASP ZAP Baseline Scan against the API documentation surface
        uses: zaproxy/action-baseline@v0.7.0
        with:
          target: 'http://localhost:3000/docs'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'

      - name: Stop Fastify API
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/taxbridge-security-api.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/taxbridge-security-api.pid")" 2>/dev/null || true
          fi
          if [ -f "$RUNNER_TEMP/taxbridge-security-api.log" ]; then
            tail -n 100 "$RUNNER_TEMP/taxbridge-security-api.log"
          fi

  # Performance/Load Tests
  # Performance/Load Tests
  performance-tests:
    name: Performance / Load Tests
    runs-on: ubuntu-latest
    needs: [integration-tests]
    if: github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ format('tbci-{0}-{1}', github.run_id, github.run_attempt) }}
          POSTGRES_DB: taxbridge_performance
        options: >-
          --health-cmd "pg_isready -U postgres -d taxbridge_performance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379
    env:
      CI: 'true'
      NODE_ENV: development
      PORT: '3000'
      LOG_FORMAT: json
      LOG_LEVEL: error
      JWT_SECRET: ci-only-taxbridge-jwt-secret-not-valid-outside-this-workflow
      ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql://postgres:${{ format('tbci-{0}-{1}', github.run_id, github.run_attempt) }}@localhost:5432/taxbridge_performance
      DIRECT_URL: postgresql://postgres:${{ format('tbci-{0}-{1}', github.run_id, github.run_attempt) }}@localhost:5432/taxbridge_performance
      REDIS_URL: redis://localhost:6379
      BASE_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Install workspace dependencies
        run: npm ci

      - name: Build shared contracts
        run: npm run build --workspace=@taxbridge/contracts

      - name: Generate Prisma client and apply migrations
        run: |
          npm run prisma:generate --prefix backend
          npm run prisma:migrate:deploy --prefix backend

      - name: Start backend server
        run: |
          npm run dev --prefix backend > "$RUNNER_TEMP/taxbridge-load-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/taxbridge-load-api.pid"
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost:3000/health/ready >/dev/null; then
              echo "Fastify API is ready."
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/taxbridge-load-api.log"
          echo "Fastify API failed to become ready." >&2
          exit 1

      - name: Run load tests
        run: |
          cd backend
          k6 run --out json=load-test-results.json load-test/k6-script.js

      - name: Upload load test results
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: backend/load-test-results.json
          if-no-files-found: error

      - name: Performance quality gates
        run: node backend/scripts/check-performance-gates.js

      - name: Stop backend server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/taxbridge-load-api.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/taxbridge-load-api.pid")" 2>/dev/null || true
          fi
          if [ -f "$RUNNER_TEMP/taxbridge-load-api.log" ]; then
            tail -n 100 "$RUNNER_TEMP/taxbridge-load-api.log"
          fi

  # OCR Processing Tests
  ocr-tests:
    name: OCR Processing Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: Run the committed OCR integration tests
        run: npm exec --prefix backend -- jest src/__tests__/performOCR.test.ts --runInBand
        env:
          CI: 'true'
  # Build and Package
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: Build shared contracts
        run: npm run build --workspace=@taxbridge/contracts

      - name: Build backend
        run: npm run build --prefix backend

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: backend-build
          path: backend/dist/

  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests, security-tests, build]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: backend-build
          path: backend/dist/

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add your staging deployment commands here
          # Example: docker build, push to registry, update k8s, etc.

  # Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests, security-tests, performance-tests, build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: backend-build
          path: backend/dist/

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment commands here
          # Example: docker build, push to registry, update k8s, etc.

      - name: Post-deployment health check
        run: |
          timeout 300 bash -c 'until curl -f https://api.taxbridge.com/api/health; do sleep 10; done'

      - name: Post-deployment smoke tests
        run: |
          curl -f https://api.taxbridge.com/api/health
          curl -f https://api.taxbridge.com/api/invoices
