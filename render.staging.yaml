# TaxBridge Staging Environment - Render Blueprint
# Deploy: render blueprint create --repo taxbridge --file render.staging.yaml
# Last Updated: 2026-11-07 (V14.2 Staging Blueprint Reconciliation)

services:
  - type: web
    name: taxbridge-api-staging
    runtime: node
    plan: starter
    region: frankfurt
    branch: master
    autoDeploy: false
    preDeployCommand: npx prisma migrate deploy --schema=backend/prisma/schema.prisma
    buildCommand: >-
      npm ci &&
      npm run build --workspace=@taxbridge/contracts &&
      npm run build --workspace=@taxbridge/backend &&
      npm run ubl:download-xsd --workspace=@taxbridge/backend
    startCommand: npm run start --workspace=@taxbridge/backend
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_VERSION
        value: 20.19.4
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: "3000"
      - key: PRISMA_SKIP_POSTINSTALL_GENERATE
        value: "true"
      - key: DIGITAX_MOCK_MODE
        value: "true"
      - key: NRS_MOCK_MODE
        value: "true"
      - key: REMITA_MOCK_MODE
        value: "true"
      - key: PAYSTACK_MOCK_MODE
        value: "true"
      - key: FLW_MOCK_MODE
        value: "true"
        value: https://sandbox.digitax.com/api
      - key: DIGITAX_API_URL
        value: https://sandbox.digitax.com/api
      - key: NRS_API_URL
        value: https://sandbox.digitax.com/api
      - key: REMITA_API_URL
        value: https://demo.remita.net
      - key: PAYSTACK_BASE_URL
        value: https://api.paystack.co
      - key: FLW_BASE_URL
        value: https://api.flutterwave.com
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: taxbridge-redis-staging
          property: connectionString
        sync: false
        sync: false
      - key: NRS_API_KEY
        sync: false
      - key: REMITA_MERCHANT_ID
        sync: false
      - key: REMITA_API_KEY
        sync: false
      - key: REMITA_SERVICE_TYPE_ID
        sync: false
      - key: REMITA_WEBHOOK_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: FLW_PUBLIC_KEY
        sync: false
      - key: FLW_SECRET_KEY
        sync: false
      - key: FLW_SECRET_HASH
        sync: false
      - key: FLW_ENCRYPTION_KEY
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: ADMIN_API_KEYS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://staging.taxbridge.ng,https://admin-staging.taxbridge.ng,http://localhost:19006,http://10.0.2.2:3000
      - key: UBL_XSD_PATH
        value: lib/ubl-invoice-2.1.xsd
      - key: ENABLE_METRICS
        value: "true"
      - key: LOG_LEVEL
        value: debug
      - key: RATE_LIMIT_MAX
        value: "200"
      - key: DATABASE_POOL_MAX
        value: "10"

  - type: worker
    name: taxbridge-worker-staging
    runtime: node
    plan: starter
    region: frankfurt
    branch: master
    autoDeploy: false
    buildCommand: >-
      npm ci &&
      npm run build --workspace=@taxbridge/contracts &&
      npm run build --workspace=@taxbridge/backend &&
      npm run ubl:download-xsd --workspace=@taxbridge/backend
    startCommand: npm run worker --workspace=@taxbridge/backend
    envVars:
      - key: NODE_VERSION
        value: 20.19.4
      - key: NODE_ENV
        value: staging
      - key: PRISMA_SKIP_POSTINSTALL_GENERATE
        value: "true"
      - key: DIGITAX_MOCK_MODE
        value: "true"
      - key: NRS_MOCK_MODE
        value: "true"
      - key: REMITA_MOCK_MODE
        value: "true"
      - key: PAYSTACK_MOCK_MODE
        value: "true"
      - key: FLW_MOCK_MODE
        value: "true"
        value: https://sandbox.digitax.com/api
      - key: DIGITAX_API_URL
        value: https://sandbox.digitax.com/api
      - key: NRS_API_URL
        value: https://sandbox.digitax.com/api
      - key: REMITA_API_URL
        value: https://demo.remita.net
      - key: PAYSTACK_BASE_URL
        value: https://api.paystack.co
      - key: FLW_BASE_URL
        value: https://api.flutterwave.com
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: taxbridge-redis-staging
          property: connectionString
        sync: false
        sync: false
      - key: NRS_API_KEY
        sync: false
      - key: REMITA_MERCHANT_ID
        sync: false
      - key: REMITA_API_KEY
        sync: false
      - key: REMITA_SERVICE_TYPE_ID
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: FLW_PUBLIC_KEY
        sync: false
      - key: FLW_SECRET_KEY
        sync: false
      - key: FLW_SECRET_HASH
        sync: false
      - key: FLW_ENCRYPTION_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: UBL_XSD_PATH
        value: lib/ubl-invoice-2.1.xsd
      - key: LOG_LEVEL
        value: debug

  - type: redis
    name: taxbridge-redis-staging
    plan: starter
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []
