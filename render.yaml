# TaxBridge Production Render Blueprint
# Last Updated: March 2026
#
# IMPORTANT: All secrets must be set in Render Dashboard
# See: backend/.env.production for required values
# Do NOT commit secrets to this file
services:
  # ============================================
  # API SERVICE (Main Web Backend)
  # ============================================
  - type: web
    name: taxbridge-api
    region: frankfurt
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # ALLOWED_ORIGINS: comma-separated list of allowed CORS origins
      # Set full value in Render Dashboard for production
      - key: ALLOWED_ORIGINS
        value: https://admin.taxbridge.ng,https://taxbridge.ng
      # Production API must never report simulated payment or tax-provider outcomes.
      - key: DIGITAX_MOCK_MODE
        value: "false"
      - key: NRS_MOCK_MODE
        value: "false"
      - key: REMITA_MOCK_MODE
        value: "false"
      - key: FLW_MOCK_MODE
        value: "false"
      - key: PAYSTACK_MOCK_MODE
        value: "false"
      # DigiTax API URL (non-secret)
      - key: DIGITAX_API_URL
        value: https://api.digitax.ng
      # Secrets — SET IN RENDER DASHBOARD
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: taxbridge-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      # Base64-encoded PKCS8 private PEM and SPKI public PEM; store as separate secrets.
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: REMITA_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_API_KEYS
        sync: false
      - key: REMITA_MERCHANT_ID
        sync: false
      - key: REMITA_API_KEY
        sync: false
      - key: REMITA_SERVICE_TYPE_ID
        sync: false
      - key: FLW_SECRET_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: DUPLO_CLIENT_ID
        sync: false
      - key: DUPLO_CLIENT_SECRET
        sync: false
  # ============================================
  # WORKER SERVICE (BullMQ Job Processor)
  # ============================================
  - type: worker
    name: taxbridge-worker
    runtime: node
    plan: starter
    region: frankfurt
    branch: master
    autoDeploy: true
    buildCommand: >-
      npm ci &&
      npm run build --workspace=@taxbridge/backend &&
      npm run ubl:download-xsd --workspace=@taxbridge/backend
    startCommand: npm run worker --workspace=@taxbridge/backend
    envVars:
      # Node Environment
      - key: NODE_VERSION
        value: 26.0.0
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Prisma
      - key: PRISMA_SKIP_POSTINSTALL_GENERATE
        value: "true"
      
      # Database - SET IN RENDER DASHBOARD (same as API service)
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      
      # Redis (Render Managed)
      - key: REDIS_URL
        fromService:
          type: redis
          name: taxbridge-redis
          property: connectionString
      
      # Background jobs also run without mock provider outcomes.
      - key: DIGITAX_MOCK_MODE
        value: "false"
      - key: NRS_MOCK_MODE
        value: "false"
      - key: REMITA_MOCK_MODE
        value: "false"
      - key: FLW_MOCK_MODE
        value: "false"
      - key: PAYSTACK_MOCK_MODE
        value: "false"
      # DigiTax API base URL
      - key: DIGITAX_API_URL
        value: https://api.digitax.ng
      
      # DigiTax / NRS Credentials - SET IN RENDER DASHBOARD
      - key: DUPLO_CLIENT_ID
        sync: false
      - key: DUPLO_CLIENT_SECRET
        sync: false

      # Admin Dashboard API Key(s) - optional for worker
      - key: ADMIN_API_KEYS
        sync: false
      
      # Remita Payment Gateway - SET IN RENDER DASHBOARD
      - key: REMITA_MERCHANT_ID
        sync: false
      - key: REMITA_API_KEY
        sync: false
      - key: REMITA_SERVICE_TYPE_ID
        sync: false
      
      # Security Secrets - SET IN RENDER DASHBOARD (same as API service)
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: REMITA_WEBHOOK_SECRET
        sync: false
      
      # UBL Validation
      - key: UBL_XSD_PATH
        value: lib/ubl-invoice-2.1.xsd
      
      # Monitoring
      - key: SENTRY_DSN
        sync: false
  # ============================================
  # REDIS CACHE SERVICE
  # ============================================
  - type: redis
    name: taxbridge-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []